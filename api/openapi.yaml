openapi: 3.0.3
info:
  title: ottstreamer origin API
  version: 1.0.0
  description: |
    Control plane of the synthetic OTT origin: streams, their lifecycle,
    their SCTE-35 ad breaks and their event log. Durations are JSON numbers of seconds, decimals
    allowed. Every call needs `Authorization: Bearer <key>` except /api/time.
security:
  - bearer: []

paths:
  /api/streams:
    get:
      operationId: listStreams
      summary: List streams with their status
      responses:
        "200":
          description: Every stream, sorted by id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Stream" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createStream
      summary: Create a stream in state stopped
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStreamRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: getStream
      summary: One stream
      responses:
        "200":
          description: The stream
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceStream
      summary: Replace name and spec; the spec applies on next start, the window at once
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceStreamRequest" }
      responses:
        "200":
          description: The updated stream
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteStream
      summary: Remove a stream that is not running, and its breaks
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/start:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    post:
      operationId: startStream
      summary: Start a new epoch from a snapshot of the spec
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRequest" }
      responses:
        "200":
          description: The running stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    post:
      operationId: stopStream
      summary: End the epoch at the frozen horizon
      responses:
        "200":
          description: The ended stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stream" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/status:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: getStreamStatus
      summary: Live position of the current epoch
      responses:
        "200":
          description: The position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamPosition" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/breaks:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: listBreaks
      summary: Upcoming, active and recent breaks of the current epoch
      responses:
        "200":
          description: Breaks sorted by start
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Break" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createBreak
      summary: Schedule a break, snapped to segment boundaries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreakRequest" }
      responses:
        "201":
          description: The scheduled break
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Break" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/breaks/{breakId}:
    parameters:
      - $ref: "#/components/parameters/StreamID"
      - name: breakId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getBreak
      summary: One break, with its cues
      responses:
        "200":
          description: The break
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Break" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBreak
      summary: Cancel a break that has not started, or end an active one early
      responses:
        "200":
          description: The updated break
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Break" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/events:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: listEvents
      summary: A page of the stream's event log, oldest first
      description: The log outlives the stream; an id that never had events gives an empty page.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Events at or after this time }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Events before this time }
        - name: types
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
          description: Comma-separated event types, e.g. break.started,break.ended
        - { name: cursor, in: query, schema: { type: string }, description: The next cursor of the previous page }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: "Default 100, at most 1000" }
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/events/live:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: streamEvents
      summary: Server-Sent Events of the stream's log
      description: |
        Replays the events after Last-Event-ID (or since), then pushes each new
        one as `id: <event id>` and `data: <Event JSON>`, with no event name, so
        EventSource.onmessage gets them all. A comment line every 15 s keeps
        the connection open. The server closes a client that falls behind; it
        reconnects and resumes from its last ID.
      parameters:
        - { name: since, in: query, schema: { type: string }, description: Replay the events after this ID }
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: Sent by a reconnecting EventSource; wins over since }
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: getTimeline
      summary: Everything the timeline view draws, in one call
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Default now minus the DVR window" }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Default now plus the DVR window" }
      responses:
        "200":
          description: Markers of the current epoch, breaks overlapping the range (future and recurring ones included) and the events in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeline" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/streams/{id}/faults:
    parameters:
      - $ref: "#/components/parameters/StreamID"
    get:
      operationId: getFaults
      summary: The active fault rules, in order, without the expired ones
      responses:
        "200":
          description: The active rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaultRule" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceFaults
      summary: Replace the active fault rules
      description: |
        Applies at once, without a restart. spec.faults only seeds the active
        rules at each start; this call leaves it alone. A rule with ttlSeconds
        gets an expiresAt and removes itself then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/FaultRule" }
      responses:
        "200":
          description: The stored rules, with defaults and expiresAt
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaultRule" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearFaults
      summary: Remove every active fault rule, at once
      responses:
        "204":
          description: Cleared
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /api/me:
    get:
      operationId: getMe
      summary: The API key the request carries, so a client can hide what its role may not do
      responses:
        "200":
          description: Its name and role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/time:
    get:
      operationId: getTime
      summary: Server UTC time for DASH UTCTiming (urn:mpeg:dash:utc:http-iso:2014)
      security: []
      parameters:
        - { name: stream, in: query, schema: { type: string }, description: "Apply the clock skew of the stream's fault rules of kind time" }
      responses:
        "200":
          description: ISO 8601 UTC time with milliseconds
          content:
            text/plain:
              schema: { type: string, example: "2026-11-06T18:30:00.123Z" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A key from ORIGIN_API_KEYS; role read allows GET only.

  parameters:
    StreamID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The ETag of the stream, `"<version>"`. Required on PUT (428 without it).
      schema: { type: string }

  headers:
    ETag:
      description: The stream version, `"<version>"`
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: "spec.video[1].bitrateKbps" }
        message: { type: string }

    Me:
      type: object
      required: [name, role]
      properties:
        name: { type: string, example: qa-team }
        role: { type: string, enum: [read, write], description: "read: GET only; write: everything" }

    CreateStreamRequest:
      type: object
      required: [id, spec]
      properties:
        id: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        name: { type: string }
        spec: { $ref: "#/components/schemas/Spec" }
    ReplaceStreamRequest:
      type: object
      required: [spec]
      properties:
        name: { type: string }
        spec: { $ref: "#/components/schemas/Spec" }
    StartRequest:
      type: object
      properties:
        ast:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
          description: Availability start time, on an even second. Default now rounded up to an even second.

    Stream:
      type: object
      required: [id, name, spec, status, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        spec: { $ref: "#/components/schemas/Spec" }
        status: { $ref: "#/components/schemas/Status" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Spec:
      type: object
      required: [formats, video, audio]
      properties:
        formats:
          type: array
          items: { type: string, enum: [hls, dash] }
        segmentSeconds: { type: number, format: double, description: "0.5-10, a whole number of frames; default 2" }
        gopSeconds: { type: number, format: double, description: "Divides segmentSeconds; default segmentSeconds" }
        fps: { type: integer, enum: [24, 25, 30, 50, 60], description: "Default 25" }
        timezone: { type: string, description: "IANA zone of the burnt-in clock; default UTC" }
        overlay: { $ref: "#/components/schemas/Overlay" }
        video:
          type: array
          items: { $ref: "#/components/schemas/Video" }
        audio:
          type: array
          items: { $ref: "#/components/schemas/Audio" }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/Subtitle" }
          description: "0-8 text tracks; ids share the rendition namespace"
        dash: { $ref: "#/components/schemas/DASH" }
        ads: { $ref: "#/components/schemas/Ads" }
        window: { $ref: "#/components/schemas/Window" }
        faults:
          type: array
          items: { $ref: "#/components/schemas/FaultRule" }
          description: "0-16 rules; seed the active rules at each start"
    Overlay:
      type: object
      properties:
        renditionLabel:
          type: boolean
          description: Burn "720p · 3000 kbit/s" into each rendition; default true
          x-go-type-skip-optional-pointer: false
    Video:
      type: object
      required: [id, width, height, bitrateKbps]
      properties:
        id: { type: string }
        codec: { type: string, enum: [h264, hevc, av1], description: "Default h264" }
        profile: { type: string, description: "h264: baseline, main or high (default); hevc: main (default) or main10; av1: main" }
        bitDepth: { type: integer, enum: [8, 10], description: "av1 only; default 8" }
        width: { type: integer }
        height: { type: integer }
        bitrateKbps: { type: integer }
    Audio:
      type: object
      required: [id, lang, channels, bitrateKbps]
      properties:
        id: { type: string }
        lang: { type: string, description: BCP 47 tag }
        name: { type: string }
        channels: { type: integer, enum: [1, 2, 6] }
        bitrateKbps: { type: integer }
        codec: { type: string, enum: [aac, ac3, eac3, opus], description: "Default aac" }
        group: { type: string, description: "Bitrate tier; default main" }
        default: { type: boolean }
        ticHz: { type: integer, description: "Beep on odd seconds; default steps up per language" }
        tocHz: { type: integer, description: "Beep on even seconds; default steps up per language" }
    Subtitle:
      type: object
      required: [id, lang, format]
      properties:
        id: { type: string }
        lang: { type: string, description: BCP 47 tag }
        name: { type: string }
        format: { type: string, enum: [webvtt, imsc1], description: "webvtt: .vtt in HLS, wvtt in DASH; imsc1: stpp in both" }
        default: { type: boolean, description: "At most one track" }
    DASH:
      type: object
      properties:
        addressing:
          type: string
          enum: [number, timeline-time, timeline-number]
          description: Default timeline-time
    Ads:
      type: object
      properties:
        leadSeconds: { type: number, format: double, description: "2 segments to 60 s; default 8" }
        command: { type: string, enum: [splice_insert, time_signal] }
        segmentationType:
          type: string
          enum: [provider_placement_opportunity, provider_ad, break, distributor_placement_opportunity]
          description: Required with time_signal, refused otherwise
        hls:
          type: array
          items: { type: string, enum: [daterange, cueout, oatcls, adobe] }
          description: Default [daterange]
        dash:
          type: array
          items: { type: string, enum: [eventstream-bin, eventstream-xml, inband] }
          description: Default [eventstream-bin]
        dashMultiPeriod: { type: boolean }
        recurring:
          allOf: [{ $ref: "#/components/schemas/Recurring" }]
          x-go-type-skip-optional-pointer: false
    Recurring:
      type: object
      required: [everySeconds, durationSeconds, offsetSeconds]
      properties:
        everySeconds: { type: number, format: double }
        durationSeconds: { type: number, format: double }
        offsetSeconds: { type: number, format: double }
    Window:
      type: object
      properties:
        dvrSeconds: { type: number, format: double, description: "3 segments to 24 h; default 30" }
        retainSeconds: { type: number, format: double, description: "dvrSeconds to 24 h; default 300" }

    FaultRule:
      type: object
      required: [id, match, action]
      properties:
        id: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        match: { $ref: "#/components/schemas/FaultMatch" }
        percent: { type: integer, description: "Share of matching requests hit, 1-100; default 100" }
        mode:
          type: string
          enum: [sticky, transient]
          description: "Default sticky: the same requests are hit on every retry and replica. transient: a random draw per request, so a retry may succeed"
        action: { $ref: "#/components/schemas/FaultAction" }
        ttlSeconds: { type: number, format: double, description: "The rule removes itself that long after it is set; absent: it stays" }
        expiresAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          x-go-type-skip-optional-pointer: false
          description: When an active rule with ttlSeconds removes itself
    FaultMatch:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [segment, init, playlist, mpd, master, time]
          description: "playlist: an HLS media playlist; master: the HLS multivariant playlist; time: /api/time?stream=<id>, clockSkewSeconds only"
        renditions:
          type: array
          items: { type: string }
          description: "Empty = every rendition; segment, init and playlist only"
        segments:
          allOf: [{ $ref: "#/components/schemas/FaultRange" }]
          x-go-type-skip-optional-pointer: false
          description: Segment numbers hit, segment only; absent = every segment
    FaultRange:
      type: object
      properties:
        from: { type: integer, format: int64, description: "First segment; default 0" }
        to: { type: integer, format: int64, nullable: true, x-go-type-skip-optional-pointer: false, description: "Last segment, included; null = open" }
    FaultAction:
      type: object
      description: One or more actions; an earlier rule wins per action when several hit
      properties:
        status: { type: integer, enum: [404, 410, 500, 503, 504], description: Reply with this code and an empty body }
        delayMs: { type: integer, description: "Wait before the first byte, up to 60000; combines with other actions" }
        throttleKbps: { type: integer, description: Send the body at this rate }
        truncatePercent: { type: integer, description: "Send only this share of the body (1-99), then close; segment and init only" }
        reset: { type: boolean, description: Close the connection without any response }
        staleSeconds: { type: number, format: double, description: "Serve the manifest as it was this long ago; playlist and mpd only" }
        gap: { type: boolean, description: "404, plus EXT-X-GAP on those segments in HLS playlists; segment and sticky only" }
        clockSkewSeconds: { type: number, format: double, description: "Shift the Date header and /api/time, within 24 h" }

    Status:
      type: object
      required: [state, pendingChanges, audioAligned]
      properties:
        state: { $ref: "#/components/schemas/State" }
        epoch:
          allOf: [{ $ref: "#/components/schemas/Epoch" }]
          x-go-type-skip-optional-pointer: false
        pendingChanges: { type: boolean, description: The spec differs from the running snapshot }
        audioAligned: { type: boolean, description: Every audio segment has the same length }
    State:
      type: string
      enum: [stopped, running, ended]
    Epoch:
      type: object
      required: [number, ast, endSegment, spec]
      properties:
        number: { type: integer }
        ast: { type: string, format: date-time }
        endSegment: { type: integer, format: int64, nullable: true, x-go-type-skip-optional-pointer: false }
        spec: { $ref: "#/components/schemas/Spec" }

    StreamPosition:
      type: object
      required: [state, now]
      properties:
        state: { $ref: "#/components/schemas/State" }
        now: { type: string, format: date-time }
        epoch: { type: integer, description: Current epoch number, x-go-type-skip-optional-pointer: false }
        liveEdge: { type: integer, format: int64, description: "Last published segment, -1 before the first", x-go-type-skip-optional-pointer: false }
        frozenHorizon: { type: integer, format: int64, description: Last segment that can no longer change, x-go-type-skip-optional-pointer: false }
        endSegment: { type: integer, format: int64, description: Last segment of an ended epoch, x-go-type-skip-optional-pointer: false }
        activeBreak:
          allOf: [{ $ref: "#/components/schemas/Break" }]
          x-go-type-skip-optional-pointer: false

    BreakRequest:
      type: object
      required: [duration]
      properties:
        duration: { type: number, format: double, description: Seconds, rounded up to whole segments }
        in: { type: string, description: 'Start after this Go duration from now, e.g. "10s"' }
        at: { type: string, format: date-time, description: Start at or after this time, x-go-type-skip-optional-pointer: false }
        replaceRecurring: { type: boolean, description: Cancel an overlapping recurring break instead of 409 }
    Break:
      type: object
      required: [id, eventId, startSegment, endSegment, start, end, requestedSeconds, durationSeconds, recurring, cancelled, cueOut, cueIn]
      properties:
        id: { type: string, description: '"1", "2", ... manual; "r-<k>" recurring' }
        eventId: { type: integer, format: int64 }
        startSegment: { type: integer, format: int64 }
        endSegment: { type: integer, format: int64, description: First segment after the break }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        requestedSeconds: { type: number, format: double }
        durationSeconds: { type: number, format: double }
        recurring: { type: boolean }
        cancelled: { type: boolean }
        cueOut: { $ref: "#/components/schemas/Cue" }
        cueIn: { $ref: "#/components/schemas/Cue" }
    Cue:
      type: object
      required: [base64, hex]
      properties:
        base64: { type: string }
        hex: { type: string }

    Event:
      type: object
      required: [id, streamId, epoch, at, segment, type, actor, data]
      properties:
        id: { type: string, description: "ULID, sorts by time" }
        streamId: { type: string }
        epoch: { type: integer, nullable: true, description: "Null for a stream event before its first start", x-go-type-skip-optional-pointer: false }
        at: { type: string, format: date-time }
        segment: { type: integer, format: int64, nullable: true, description: "Media position, when there is one", x-go-type-skip-optional-pointer: false }
        type: { type: string, example: break.started }
        actor: { type: string, description: '"api:<key name>" or "system"', example: "api:qa-team" }
        data:
          type: object
          additionalProperties: true
          example: { breakId: "7", eventId: 7, durationSeconds: 30, source: manual }
    EventPage:
      type: object
      required: [events, next]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next: { type: string, nullable: true, description: Cursor of the next page; null on the last, x-go-type-skip-optional-pointer: false }
    Timeline:
      type: object
      required: [now, from, to, state, breaks, events, eventsNext]
      properties:
        now: { type: string, format: date-time }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/State" }
        epoch: { type: integer, description: "Current epoch, unless stopped", x-go-type-skip-optional-pointer: false }
        ast: { type: string, format: date-time, x-go-type-skip-optional-pointer: false }
        segmentSeconds: { type: number, format: double, x-go-type-skip-optional-pointer: false }
        liveEdge: { type: integer, format: int64, description: "Last published segment, -1 before the first", x-go-type-skip-optional-pointer: false }
        frozenHorizon: { type: integer, format: int64, description: Last segment that can no longer change, x-go-type-skip-optional-pointer: false }
        dvrStart: { type: integer, format: int64, description: First segment of the DVR window, x-go-type-skip-optional-pointer: false }
        endSegment: { type: integer, format: int64, description: Last segment of an ended epoch, x-go-type-skip-optional-pointer: false }
        breaks:
          type: array
          items: { $ref: "#/components/schemas/Break" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
          description: At most 1000; page the rest with /events from eventsNext
        eventsNext: { type: string, nullable: true, description: Cursor of the events after the last one returned, x-go-type-skip-optional-pointer: false }
